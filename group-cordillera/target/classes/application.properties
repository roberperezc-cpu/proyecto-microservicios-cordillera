spring.application.name=group-cordillera
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/db_cordillera_sales?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hipernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always